---
layout: post
---

<div id="gate" style="max-width: 400px; margin: 3rem auto; text-align: center; color: #a9ccc8;">
  <p style="color: #2ed3c1; font-weight: 700; margin-bottom: 1rem;">This post is password protected.</p>
  <input type="password" id="gate-pass" placeholder="Password"
         style="padding: 0.5rem; width: 70%; background: #0c2326; color: #d5f1ee; border: 1px solid #1d6b67; border-radius: 6px;">
  <button id="gate-btn"
          style="padding: 0.5rem 1rem; margin-left: 0.25rem; background: #14a89a; color: #04171a; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">Unlock</button>
  <p id="gate-err" style="color: #ff6b6b; display: none; margin-top: 0.75rem;">Wrong password.</p>
</div>

<div id="gated-content" style="display: none;">
  {{ content }}
</div>

<script>
  (function () {
    var correct = {{ page.password | jsonify }};
    var btn = document.getElementById('gate-btn');
    var input = document.getElementById('gate-pass');
    var err = document.getElementById('gate-err');

    function unlock() {
      if (input.value === correct) {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('gated-content').style.display = 'block';
      } else {
        err.style.display = 'block';
      }
    }

    btn.addEventListener('click', unlock);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') unlock();
    });
  })();
</script>
